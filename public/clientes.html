</nav><div class="container mt-5"><div class="d-flex justify-content-between align-items-center mb-4"><h2>Gestão de Clientes</h2><button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalNovoCliente">+ Novo Cliente</button></div><div class="card bg-dark border-secondary"><div class="card-body"><table class="table table-dark table-hover mt-3"><thead><tr><th>ID</th><th>Nome do Cliente</th><th>WhatsApp</th><th>Email</th><th>Status</th></tr></thead><tbody id="tabelaClientes"></tbody></table><small class="text-muted">* Clique no nome do cliente para visualizar ou editar.</small></div></div></div><div class="modal fade" id="modalNovoCliente" tabindex="-1"><div class="modal-dialog"><div class="modal-content bg-dark text-light border-secondary"><div class="modal-header border-secondary"><h5 class="modal-title">Cadastrar Novo Cliente</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body"><form id="formCliente"><div class="mb-3"><label>Nome *</label><input type="text" class="form-control bg-secondary text-light border-0" id="nomeCliente" required></div><div class="mb-3"><label>WhatsApp *</label><input type="text" class="form-control bg-secondary text-light border-0" id="whatsappCliente" required></div><div class="mb-3"><label>E-mail</label><input type="email" class="form-control bg-secondary text-light border-0" id="emailCliente"></div><div class="modal-footer border-secondary px-0 pb-0"><button type="submit" class="btn btn-primary">Salvar</button></div></form></div></div></div></div><div class="modal fade" id="modalEditarCliente" tabindex="-1"><div class="modal-dialog"><div class="modal-content bg-dark text-light border-secondary"><div class="modal-header border-secondary"><h5 class="modal-title">Detalhes e Edição do Cliente</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body"><form id="formEditCliente"><input type="hidden" id="editCliID"><div class="mb-3"><label>Nome</label><input type="text" class="form-control bg-secondary text-light border-0" id="editCliNome" required></div><div class="mb-3"><label>WhatsApp</label><input type="text" class="form-control bg-secondary text-light border-0" id="editCliWhatsApp" required></div><div class="mb-3"><label>E-mail</label><input type="email" class="form-control bg-secondary text-light border-0" id="editCliEmail"></div><div class="mb-3"><label>Status do Cliente</label><select class="form-select bg-secondary text-light border-0" id="editCliStatus"><option value="Ativo">Ativo</option><option value="Bloqueado">Bloqueado</option></select></div><div class="modal-footer border-secondary px-0 pb-0"><button type="submit" class="btn btn-success">Salvar Alterações</button></div></form></div></div></div></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script><script src="js/auth.js"></script><script src="js/app.js"></script></body></html>
