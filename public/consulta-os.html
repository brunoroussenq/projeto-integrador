<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Consultar ordens de serviço - OS System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dark text-light">
    <main class="container py-5" style="max-width: 760px">
        <a href="login.html" class="text-decoration-none">&larr; Voltar ao login</a>
        <section class="card bg-dark border-secondary mt-4">
            <div class="card-body p-4 p-md-5">
                <h1 class="h3 text-primary fw-bold">Consulta de ordens de serviço</h1>
                <p class="text-light-emphasis">Informe o CPF cadastrado na assistência para consultar suas OS abertas e finalizadas.</p>
                <form id="formConsultaOS" class="mt-4">
                    <label for="cpfConsulta" class="form-label">CPF</label>
                    <div class="input-group">
                        <input type="text" id="cpfConsulta" class="form-control bg-secondary text-light border-0" placeholder="000.000.000-00" inputmode="numeric" autocomplete="off" maxlength="14" required aria-describedby="cpfAjuda">
                        <button class="btn btn-primary" type="submit" id="btnConsultarOS">Consultar</button>
                    </div>
                    <div id="cpfAjuda" class="form-text">Usaremos o CPF somente para localizar suas ordens de serviço.</div>
                </form>
                <div id="consultaMensagem" class="mt-4" role="status" aria-live="polite"></div>
                <div id="resultadoConsultaOS" class="mt-3"></div>
            </div>
        </section>
    </main>
    <script src="js/consulta-os.js"></script>
</body>
</html>
