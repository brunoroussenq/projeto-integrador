<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><title>Imprimir OS</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><style>body { background-color: #f8f9fa; color: #212529; font-family: Arial, sans-serif; font-size: 13px; } .os-container { max-width: 800px; margin: 20px auto; background: #ffffff; padding: 30px; border: 1px solid #dee2e6; box-shadow: 0 4px 15px rgba(0,0,0,0.05); } @media print { body { background: #ffffff; color: #000; font-size: 12px; } .os-container { max-width: 100%; margin: 0; padding: 0; border: none; box-shadow: none; } .no-print { display: none !important; } }</style></head><body><div class="container text-center my-3 no-print"><button class="btn btn-primary btn-lg shadow px-4" onclick="window.print()">🖨️ Imprimir / Salvar como PDF</button><button class="btn btn-outline-secondary btn-lg ms-2" onclick="window.close()">Fechar</button></div><div class="os-container"><div class="border-bottom border-primary border-2 pb-3 mb-4 d-flex justify-content-between align-items-center"><div><h3 class="fw-bold mb-1" style="color: #004a8d;">ASSISTÊNCIA TÉCNICA ESPECIALIZADA</h3><div class="small text-muted">CNPJ: 00.000.000/0001-00 | Tel: (48) 98819-0003</div></div><div class="text-end"><div class="fs-4 fw-bold">ORDEM DE SERVIÇO</div><div class="fs-3 fw-bold text-danger">#<span id="printOSId">--</span></div></div></div><div class="mb-2"><strong>Cliente:</strong> <span id="printClienteNome">--</span> | <strong>Tel:</strong> <span id="printClienteWhatsApp">--</span></div><div class="mb-4"><strong>Aparelho:</strong> <span id="printAparelho">--</span><br><strong>Defeito:</strong> <span id="printDefeito">--</span></div><table class="table table-sm table-bordered mb-4"><thead class="table-light"><tr><th>Cód</th><th>Descrição</th><th>Qtd</th><th>Unitário</th><th>Subtotal</th></tr></thead><tbody id="printTabelaItens"></tbody></table><div class="row justify-content-end mb-5"><div class="col-5"><table class="table table-sm table-bordered"><tr><td>Subtotal Peças:</td><td class="text-end fw-bold">R$ <span id="printTotalPecas">0.00</span></td></tr><tr><td>Mão de Obra:</td><td class="text-end fw-bold">R$ <span id="printMaoObra">0.00</span></td></tr><tr class="table-light"><td class="fw-bold">TOTAL DA OS:</td><td class="fs-5 fw-bold text-end text-success">R$ <span id="printValorTotal">0.00</span></td></tr></table></div></div><div class="row mt-5 pt-5 text-center"><div class="col-6"><div class="border-top border-dark pt-2 mx-4"><strong>Técnico Responsável</strong></div></div><div class="col-6"><div class="border-top border-dark pt-2 mx-4"><strong>Assinatura do Cliente</strong></div></div></div></div><script>async function carregarDadosImpressao() { const id = new URLSearchParams(window.location.search).get('id'); if(!id) return; try { const resOS = await fetch('/api/os/'+id); const os = await resOS.json(); document.getElementById('printOSId').innerText = os.id_os; document.getElementById('printClienteNome').innerText = os.cliente; document.getElementById('printClienteWhatsApp').innerText = os.whatsapp; document.getElementById('printAparelho').innerText = os.aparelho; document.getElementById('printDefeito').innerText = os.defeito_relatado; document.getElementById('printMaoObra').innerText = Number(os.valor_mao_obra||0).toFixed(2); const resItens = await fetch('/api/os/'+id+'/itens'); const itens = await resItens.json(); const tbody = document.getElementById('printTabelaItens'); let totalPecas = 0; tbody.innerHTML=''; itens.forEach(item => { totalPecas += Number(item.subtotal); tbody.innerHTML += `<tr><td>${item.codigo_ref}</td><td>${item.descricao}</td><td>${item.quantidade}</td><td class="text-end">R$ ${Number(item.valor_unitario).toFixed(2)}</td><td class="text-end">R$ ${Number(item.subtotal).toFixed(2)}</td></tr>`; }); document.getElementById('printTotalPecas').innerText = totalPecas.toFixed(2); document.getElementById('printValorTotal').innerText = (totalPecas + Number(os.valor_mao_obra||0)).toFixed(2); } catch (e) { alert('Erro.'); } } document.addEventListener('DOMContentLoaded', carregarDadosImpressao);</script></body></html>
