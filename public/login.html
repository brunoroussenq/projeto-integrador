<!DOCTYPE html><html lang="pt-BR" data-bs-theme="dark"><head><meta charset="UTF-8"><title>Login - OS System</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><style>body { display: flex; align-items: center; justify-content: center; height: 100vh; } .login-box { width: 100%; max-width: 400px; padding: 20px; background: #343a40; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }</style></head><body class="bg-dark text-light"><div class="login-box text-center border border-secondary"><h2 class="text-primary fw-bold mb-4">OS System</h2><form id="formLogin"><div class="mb-3 text-start"><label>E-mail</label><input type="email" id="loginEmail" class="form-control bg-secondary text-light border-0" required placeholder="admin@admin.com"></div><div class="mb-4 text-start"><label>Senha</label><input type="password" id="loginSenha" class="form-control bg-secondary text-light border-0" required placeholder="123456"></div><button type="submit" class="btn btn-primary w-100">Entrar no Sistema</button></form><div id="loginAlert" class="alert alert-danger mt-3 d-none"></div></div><script src="js/auth.js"></script></body></html>
