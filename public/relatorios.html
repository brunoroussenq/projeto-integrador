<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Relatórios | OS System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dark text-light">
    <nav class="navbar navbar-expand-lg navbar-light navbar-site border-bottom">
        <div class="container">
            <a class="navbar-brand text-primary fw-bold" href="index.html" aria-label="Página inicial">OS System</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Abrir navegação"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item dropdown"><a class="nav-link dropdown-toggle" href="#" id="navbarCadastro" role="button" data-bs-toggle="dropdown" aria-expanded="false">Cadastros</a><ul class="dropdown-menu border-secondary" aria-labelledby="navbarCadastro"><li><a class="dropdown-item" href="clientes.html">Clientes</a></li><li><a class="dropdown-item" href="estoque.html">Catálogo de Peças</a></li><li><a class="dropdown-item" href="empresa.html">Empresa</a></li></ul></li>
                    <li class="nav-item"><a class="nav-link" href="os.html">Ordens de Serviço</a></li>
                    <li class="nav-item"><a class="nav-link" href="vendas.html">Vendas</a></li>
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="relatorios.html">Relatórios</a></li>
                </ul>
                <div class="d-flex align-items-center"><span class="navbar-text me-3 text-light" id="userNomeDisplay"></span><button class="btn btn-outline-danger btn-sm" onclick="logout()">Sair</button></div>
            </div>
        </div>
    </nav>

    <main class="container py-4 py-lg-5">
        <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
            <div><p class="text-info text-uppercase small fw-bold mb-1">Visão geral</p><h1 class="h2 mb-1">Relatórios</h1><p class="text-secondary mb-0">Acompanhe vendas, ordens de serviço e movimentação do estoque.</p></div>
            <div class="d-flex gap-2"><button class="btn btn-outline-light" type="button" onclick="exportarRelatorioCSV()">Exportar CSV</button><button class="btn btn-primary" type="button" onclick="imprimirRelatorio()">Imprimir</button></div>
        </div>

        <section class="card bg-dark border-secondary mb-4" aria-label="Filtros do relatório">
            <div class="card-body"><div class="row align-items-end g-3">
                <div class="col-12 col-md-4"><label class="form-label" for="relatorioTipo">Relatório</label><select class="form-select bg-dark text-light border-secondary" id="relatorioTipo"><option value="vendas">Vendas</option><option value="os">Ordens de Serviço</option><option value="estoque">Estoque</option></select></div>
                <div class="col-6 col-md-3" id="filtroInicio"><label class="form-label" for="dataInicio">De</label><input class="form-control bg-dark text-light border-secondary" type="date" id="dataInicio"></div>
                <div class="col-6 col-md-3" id="filtroFim"><label class="form-label" for="dataFim">Até</label><input class="form-control bg-dark text-light border-secondary" type="date" id="dataFim"></div>
                <div class="col-12 col-md-2"><button class="btn btn-info text-dark fw-semibold w-100" id="btnAplicarRelatorio" type="button">Aplicar filtros</button></div>
            </div></div>
        </section>

        <div id="relatorioErro" class="alert alert-danger d-none" role="alert"></div>
        <div id="relatorioLoading" class="text-center py-5 d-none" role="status"><div class="spinner-border text-info" aria-hidden="true"></div><span class="visually-hidden">Carregando relatório...</span></div>
        <section id="relatorioConteudo" aria-live="polite">
            <div class="row g-3 mb-4" id="relatorioResumo"></div>
            <div class="card bg-dark border-secondary">
                <div class="card-header bg-transparent border-secondary d-flex flex-wrap justify-content-between align-items-center gap-2"><h2 class="h5 mb-0" id="relatorioTitulo">Vendas</h2><span class="text-secondary small" id="relatorioContagem"></span></div>
                <div class="table-responsive"><table class="table table-dark table-hover align-middle mb-0"><thead id="relatorioCabecalho"></thead><tbody id="relatorioLinhas"></tbody></table></div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script><script src="js/app.js"></script><script src="js/relatorios.js"></script>
</body>
</html>
